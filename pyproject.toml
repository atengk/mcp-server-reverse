[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "atengk-mcp-server-reverse"
version = "1.0.0"
description = "专为 AI Agent 打造的跨平台二进制静态逆向分析与数字取证 MCP Server（原生支持 PE / ELF / Mach-O，内置 LIEF + Capstone + pefile 内核并按需挂载 radare2 / objdump / floss）"
readme = "README.md"
license = { file = "LICENSE" }
authors = [
    { name = "Ateng" }
]
requires-python = ">=3.11"
keywords = [
    "mcp",
    "model-context-protocol",
    "reverse-engineering",
    "binary-analysis",
    "disassembly",
    "decompiler",
    "lief",
    "capstone",
    "pefile",
    "radare2",
    "malware-analysis",
    "dfir"
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Disassemblers",
]
dependencies = [
    "mcp[cli]>=1.2.0",
    "lief>=0.14.0",
    "capstone>=5.0.0",
    "pefile>=2023.2.7",
]

[project.urls]
Homepage = "https://github.com/atengk/mcp-server-reverse"
Repository = "https://github.com/atengk/mcp-server-reverse.git"
Issues = "https://github.com/atengk/mcp-server-reverse/issues"

[project.scripts]
mcp-server-reverse = "mcp_server_reverse.cli:main"
atengk-mcp-server-reverse = "mcp_server_reverse.cli:main"

[dependency-groups]
dev = [
    "ruff>=0.8.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=5.0.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_server_reverse"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
