# ==============================================================================
# Dependabot 依赖自动化更新配置 (Dependabot Version Updates)
#
# 机制说明：
# 1. 本配置负责常规月度依赖升级（Version Updates），采用语义化双轨模型聚合 PR；
# 2. 涵盖 GitHub Actions、Python (pip/uv) 与 Docker 基础镜像三大生态。
# ==============================================================================

version: 2
updates:
  # 1. 持续监控 GitHub Actions 工作流版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 2. 持续监控 Python 依赖更新 (pyproject.toml / uv.lock)
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 3. 持续监控 Dockerfile 容器基础镜像更新
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      docker-images:
        patterns:
          - "*"
