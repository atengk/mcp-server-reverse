# ==============================================================================
# Dependabot 依赖自动化更新配置 (Dependabot Version Updates)
#
# 机制说明：
# 1. 本配置负责常规月度依赖升级（Version Updates），采用语义化双轨模型聚合 PR；
# 2. 针对高危 CVE 漏洞的即时修复（Dependabot Security Updates）由 GitHub 平台原生实时安抚，两者互补。
# ==============================================================================

version: 2
updates:
  # 持续监控 GitHub Actions 工作流版本更新
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "ci"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      actions:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 监控 Python 依赖生态
  - package-ecosystem: "pip"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    groups:
      dependencies:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"

  # 监控 Dockerfile 基础镜像更新
  - package-ecosystem: "docker"
    directory: "/"
    schedule:
      interval: "monthly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "build"
      include: "scope"
    labels:
      - "dependencies"
    ignore:
      - dependency-name: "python"
        versions: [">= 3.13"]
    groups:
      docker-images:
        patterns:
          - "*"
        update-types:
          - "minor"
          - "patch"
